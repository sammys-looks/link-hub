
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Finds | Sammy's Looks</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 18px;
      background: linear-gradient(#f9edf0, #fff9f7);
      color: #543d47;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .back {
      display: inline-block;
      color: #806571;
      text-decoration: none;
      margin-bottom: 24px;
    }

    h1 { font-size: 30px; }

    .subtitle {
      color: #806571;
      line-height: 1.5;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .product {
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 16px;
      overflow: hidden;
      padding-bottom: 16px;
      text-align: center;
    }

    .product img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .product h3 {
      font-size: 15px;
      margin: 14px 10px;
    }

    .product a {
      display: inline-block;
      padding: 11px 18px;
      background: #eac6d2;
      color: #543d47;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      margin-top: 45px;
      text-align: center;
      color: #907984;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (min-width: 650px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Back to My Links</a>

    <header>
      <h1>🛍️ Sammy's Amazon Finds</h1>
      <p class="subtitle">
        My favorite fashion finds, accessories,
        and little things I love. 💕
      </p>
    </header>

    <section class="products">
      <!-- Product cards will go here -->
    </section>

    <footer>
      As an Amazon Associate I earn from
      qualifying purchases.
      <br>
      Some links may earn commissions.
      <br>
      Sammy is a fictional AI-created influencer.
    </footer>
  </main>
</body>
</html>
