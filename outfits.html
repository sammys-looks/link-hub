
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop My Outfits | Sammy's Looks</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 18px;
      min-height: 100vh;
      background: linear-gradient(#f9edf0, #fff9f7);
      color: #543d47;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: #806571;
      text-decoration: none;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    h1 { font-size: 30px; }

    .subtitle {
      color: #806571;
      line-height: 1.5;
    }

    .outfits {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .outfit {
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 18px;
    }

    .outfit img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    .outfit h3 {
      margin: 14px 10px;
      font-size: 16px;
    }

    .outfit a {
      display: inline-block;
      padding: 12px 18px;
      background: #eac6d2;
      color: #543d47;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 45px;
      text-align: center;
      color: #907984;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (min-width: 650px) {
      .outfits {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Back to My Links</a>

    <header>
      <h1>👗 Shop My Outfits</h1>
      <p class="subtitle">
        Cute looks, favorite pieces, and
        a little outfit inspiration. 💕
      </p>
    </header>

    <section class="outfits">
      <!-- Outfit cards will go here -->
    </section>

    <footer>
      As an Amazon Associate I earn from
      qualifying purchases.
      <br>
      Some links may earn commissions.
      <br>
      Sammy is a fictional AI-created influencer.
    </footer>
  </main>
</body>
</html>
